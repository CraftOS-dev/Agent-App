name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build · typecheck · test · conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (unit + conformance A/B/C + Toolkit)
        run: pnpm -r test

  python-sdk:
    name: python sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the Python SDK
        working-directory: sdks/python
        run: python tests/test_sdk.py

  pack:
    name: npm pack (publish dry-run, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Verify the publishable packages pack cleanly
        run: pnpm -r --filter "./adapters/rules" --filter "./sdks/typescript" --filter "./adapters/adapter-core" --filter "./framework/host" --filter "./toolkits/kit" --filter "./framework/cli" exec npm pack --dry-run
