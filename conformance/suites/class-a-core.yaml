class: A
name: Core protocol
description: >
  Discovery, describe, HTTP binding, guard, idempotency, read-back, security,
  IAM, operations, and errors. Class A is required for a stable release: every
  check here has at least one assertion branching on structure, never on prose.

checks:
  # --- Discovery and identity ------------------------------------------------
  - name: identity carries the a2app marker and protocol
    request: { method: GET, path: /api/_a2app }
    expect:
      status: 200
      match:
        a2app: true
        protocol: "0.1"
      has: [app.id, schemaVersion, serverNow, serverTzOffsetMinutes]

  - name: well-known identity is the same document
    request: { method: GET, path: /.well-known/a2app.json }
    expect:
      status: 200
      match: { a2app: true, app.id: conformance_kanban }

  # --- Describe: navigational, one level per request (A2APP-SPEC 3) ----------
  # Every assertion here addresses a level BY PATH, never by ordinal position in
  # a list. An ordinal assertion certifies the flat shape it was written against
  # and would pass an implementation that never subdivided anything.

  - name: describe root lists modules with counts and the caller's access
    request: { method: GET, path: /api/_a2app/describe, token: full }
    expect:
      status: 200
      match:
        level: root
        app.id: conformance_kanban
        modules.0.name: board
        modules.0.entities: 2
        modules.0.access: full
      has: [conventions, next]
      # The root is O(modules), never O(entities): it must not leak field detail.
      absent: [entities, fields, operations.0.params]

  - name: every describe level fits the per-response budget
    request: { method: GET, path: /api/_a2app/describe, token: full }
    expect:
      status: 200
      maxChars: 2000

  - name: a module lists entity and operation NAMES, never their schemas
    request: { method: GET, path: /api/_a2app/describe/board, token: full }
    expect:
      status: 200
      maxChars: 2000
      match:
        level: module
        path: board
      has: [entities, operations, next]
      # Names only — a field schema at this level would reintroduce the flat cost.
      absent: [entities.0.fields, fields]

  - name: an entity level carries its fields and the operations that act on it
    request: { method: GET, path: /api/_a2app/describe/board/cards, token: full }
    expect:
      status: 200
      maxChars: 2000
      match:
        level: entity
        path: board/cards
        label: title
        records: /api/collections/cards/records
        fields.created.readOnly: true
        fields.due.format: YYYY-MM-DD
        operations.0.name: finish-card
        operations.0.entity: cards
        operations.0.params.card.type: ref
      has: [next]

  - name: an operation appears on its entity, never in a global list
    request: { method: GET, path: /api/_a2app/describe/board, token: full }
    expect:
      status: 200
      # `finish-card` is attached to cards, so the module screen shows only the
      # module-level operations. Two, not three.
      len: { operations: 2 }

  - name: describe carries the optional operation flags (readOnly / idempotent)
    request: { method: GET, path: /api/_a2app/describe/board, token: full }
    expect:
      status: 200
      match:
        operations.1.name: count-cards

  - name: a record level marks each operation available for THIS record
    request: { method: GET, path: /api/_a2app/describe/board/cards/card_seed, token: full }
    expect:
      status: 200
      maxChars: 2000
      match:
        level: record
        id: card_seed
        label: Welcome card
        operations.0.name: finish-card
        operations.0.available: true
      has: [next]

  - name: an unavailable operation is shown with its reason, never hidden
    request:
      method: PATCH
      path: /api/collections/cards/records/card_seed
      token: full
      body: { done: true }
    expect: { status: 200 }

  - name: the blocked reason is derived from the record, not composed
    request: { method: GET, path: /api/_a2app/describe/board/cards/card_seed, token: full }
    expect:
      status: 200
      match:
        operations.0.name: finish-card
        operations.0.available: false
        operations.0.blocked: done is true

  - name: search returns locations by name, across the app
    request: { method: GET, path: /api/_a2app/describe, token: full, query: { find: card } }
    expect:
      status: 200
      maxChars: 2000
      match:
        level: find
        term: card
      has: [matches, next]

  - name: an unknown module is refused with the modules that exist
    request: { method: GET, path: /api/_a2app/describe/nope, token: full }
    expect:
      status: 404
      match: { code: unknown_module }
      has: [modules]

  - name: an entity addressed under the wrong module is not found
    request: { method: GET, path: /api/_a2app/describe/board/nope, token: full }
    expect:
      status: 404
      match: { code: unknown_entity }

  - name: there is no endpoint returning the whole model
    request: { method: GET, path: /api/_a2app/describe/board/cards/card_seed/nope, token: full }
    expect:
      status: 404
      match: { code: unknown_relation }

  # --- Read ------------------------------------------------------------------
  - name: a credentialled read returns records
    request: { method: GET, path: /api/collections/lists/records, token: full }
    expect:
      status: 200
      len: { items: 2 }

  # --- Guard: rejects all violations in one response -------------------------
  - name: guard rejects unknown field, bad enum, and relative date together
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      body: { title: "x", due: "tomorrow", priority: "nope", bogus: 1 }
    expect:
      status: 400
      match: { a2app: true, ok: false }
      len: { violations: 3 }

  # A field named after an Object.prototype member must not read as declared.
  # On a plain-object field map `map["constructor"]` is truthy, which passed the
  # unknown-field check and every rule after it, so the key reached the backend.
  - name: a field named after a prototype member is still unknown
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      body: { title: "x", constructor: "evil" }
    expect:
      status: 400
      match:
        a2app: true
        ok: false
        violations.0.code: unknown_field
        violations.0.field: constructor
      len: { violations: 1 }

  - name: guard writes to a read-only field are refused
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      body: { title: "ok", created: "2020-01-01" }
    expect:
      status: 400
      match: { violations.0.code: read_only_field, violations.0.field: created }

  # --- A correct write lands (read-back passes) ------------------------------
  - name: a valid create stores and returns the record
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      body: { title: "Buy milk", priority: "high" }
    expect:
      status: 200
      match: { title: "Buy milk", priority: "high" }
      has: [id]
      save: { newCardId: id }

  # --- Idempotency -----------------------------------------------------------
  - name: first keyed write succeeds
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      headers: { idempotency-key: idem-1 }
      body: { title: "Once only" }
    expect:
      status: 200
      save: { idemId: id }

  - name: replaying the idempotency key returns 409 naming the record
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      headers: { idempotency-key: idem-1 }
      body: { title: "Once only" }
    expect:
      status: 409
      match: { code: duplicate_request, id: "${idemId}" }

  # --- Security: origin + credential -----------------------------------------
  - name: a foreign browser origin is refused 403 (before the guard)
    request:
      method: POST
      path: /api/collections/cards/records
      token: full
      origin: https://evil.example
      body: { bogus: 1 }
    expect:
      status: 403
      match: { code: forbidden_origin }

  - name: an uncredentialled program write gets the 401 challenge
    request:
      method: POST
      path: /api/collections/cards/records
      body: { title: "x" }
    expect:
      status: 401
      match: { code: agent_token_required }
      has: [how]

  # --- IAM: scopes + whoami --------------------------------------------------
  - name: a read-only grant may read
    request: { method: GET, path: /api/collections/cards/records, token: readonly }
    expect: { status: 200 }

  - name: a read-only grant may not write (insufficient_scope)
    request:
      method: POST
      path: /api/collections/cards/records
      token: readonly
      body: { title: "nope" }
    expect:
      status: 403
      match: { code: insufficient_scope, required: "data:cards:write" }

  - name: whoami answers the uncredentialled caller this app actually serves
    # whoami reports what a caller may do. On a single-user app an
    # uncredentialled caller reads records perfectly well, so refusing it here
    # made whoami stricter than the surface it describes -- an agent that reads
    # its grant before planning (the documented order) stopped at a gate it did
    # not have to.
    request: { method: GET, path: /api/_a2app/whoami }
    expect:
      status: 200
      match: { a2app: true, credentialId: anonymous, principal: owner }

  - name: that caller's scopes are reads and readOnly operations, nothing more
    # `scopes` is sorted, so these ordinals are stable. The point is the SET:
    # both entities readable, the readOnly operation runnable, and no write and
    # no state-changing operation -- which is exactly what authorize enforces.
    request: { method: GET, path: /api/_a2app/whoami }
    expect:
      status: 200
      match:
        scopes.0: "data:cards:read"
        scopes.1: "data:lists:read"
        scopes.2: "op:count-cards"
      len: { scopes: 3 }

  - name: describe tells that caller read-only, not full
    # It used to say "full", then answer the write it had just promised with a
    # 401. An agent reads access to know what it may plan; an over-report there
    # is a plan built on permission that was never held.
    request: { method: GET, path: /api/_a2app/describe }
    expect:
      status: 200
      match: { modules.0.access: read-only }

  - name: a state-changing operation is still refused without a credential
    request: { method: POST, path: /api/ops/archive-board, body: {} }
    expect:
      status: 401
      match: { code: agent_token_required }
      has: [how]

  - name: whoami returns the calling credential's grant
    request: { method: GET, path: /api/_a2app/whoami, token: readonly }
    expect:
      status: 200
      match: { credentialId: cred_ro, principal: owner }
      has: [scopes]

  # --- Guard: an operation's arguments are guarded like a write --------------
  - name: an operation's required parameter is enforced
    request: { method: POST, path: /api/ops/finish-card, token: full, body: {} }
    expect:
      status: 400
      match:
        a2app: true
        ok: false
        violations.0.code: missing_required
        violations.0.field: card
      len: { violations: 1 }

  - name: an operation refuses an undeclared parameter
    request:
      method: POST
      path: /api/ops/finish-card
      token: full
      body: { card: "card_seed", bogus: 1 }
    expect:
      status: 400
      match:
        a2app: true
        ok: false
        violations.0.code: unknown_field
        violations.0.field: bogus
      len: { violations: 1 }

  # --- Approval --------------------------------------------------------------
  - name: a destructive op without approval returns the content-addressed key
    request: { method: POST, path: /api/ops/archive-board, token: full, body: {} }
    expect:
      status: 428
      match: { code: approval_required }
      has: [approvalKey]
      save: { approval: approvalKey }

  - name: re-invoking with the key executes the operation
    request:
      method: POST
      path: /api/ops/archive-board
      token: full
      headers: { x-a2app-approval: "${approval}" }
      body: {}
    expect:
      status: 200
      match: { ok: true, operation: archive-board }

  - name: a non-destructive op runs without approval
    request: { method: POST, path: /api/ops/count-cards, token: full, body: {} }
    expect:
      status: 200
      match: { ok: true, result.count: 1 }

  # --- Errors ----------------------------------------------------------------
  - name: an unknown operation is a rejection, never a success
    request: { method: POST, path: /api/ops/does-not-exist, token: full, body: {} }
    expect:
      status: 404
      match: { a2app: true, ok: false, code: unknown_operation }
