class: B
name: CLI binding
description: >
  Class A plus the CLI binding: the same operations any agent performs, driven
  through the `a2app` CLI, with the pinned exit-code contract — 0 success,
  1 rejected, 2 usage, 3 unreachable. Skipped automatically if the CLI is not
  built.

  The CLI is a WALK (A2APP-SPEC 4.1): `a2app <app> [<path…>] [<operation>]`.
  Its arguments name a location in the app, not a verb. `data` and the other
  reserved segments are the exception, not the shape.

checks:
  # --- The walk --------------------------------------------------------------
  - name: a bare app lands on the root screen, not a usage error
    cli: { args: ["<APPDIR>"] }
    expect:
      exit: 0
      contains: board

  - name: every screen ends by naming the legal next moves
    cli: { args: ["<APPDIR>"] }
    expect:
      exit: 0
      # The footer is the only navigation aid the surface has; a client that
      # drops it leaves an agent with no way to learn what it may do next.
      contains: "→"

  - name: a module screen lists its entities
    cli: { args: ["<APPDIR>", "board"] }
    expect:
      exit: 0
      contains: cards

  - name: an entity screen shows fields with their enum values
    cli: { args: ["<APPDIR>", "board", "cards"] }
    expect:
      exit: 0
      contains: urgent

  - name: a record screen shows the operations its state allows
    cli: { args: ["<APPDIR>", "board", "cards", "card_seed"] }
    expect:
      exit: 0
      contains: finish-card

  - name: a segment that is not here is refused, with the moves that are (exit 1)
    cli: { args: ["<APPDIR>", "board", "nonsuch"] }
    expect:
      exit: 1

  - name: search by name returns locations
    cli: { args: ["<APPDIR>", "--find", "card"] }
    expect:
      exit: 0
      contains: board/cards

  # --- data: raw record access, alongside the walk ---------------------------
  - name: data schema lists entity names by module (exit 0)
    cli: { args: ["<APPDIR>", "data", "schema"] }
    expect:
      exit: 0
      contains: cards

  - name: data <entity> schema shows that entity's fields (exit 0)
    cli: { args: ["<APPDIR>", "data", "cards", "schema"] }
    expect:
      exit: 0
      contains: title

  - name: data list returns records (exit 0)
    cli: { args: ["<APPDIR>", "data", "lists", "list"] }
    expect:
      exit: 0
      contains: "To Do"

  - name: data create with a valid field succeeds (exit 0)
    cli: { args: ["<APPDIR>", "data", "cards", "create", "--title", "From the CLI"] }
    expect:
      exit: 0
      contains: "From the CLI"
      save: { probe: id }

  # The path names the record, so the caller must not have to repeat it: the
  # record level names the parameter that takes it and the client fills it in.
  # Asserted on a record created here, because the seed card is deliberately
  # marked done earlier and this operation is correctly blocked on it.
  - name: an operation invoked at a record path receives that record
    cli: { args: ["<APPDIR>", "board", "cards", "${probe}", "finish-card"] }
    expect:
      exit: 0
      match: { result.card: "${probe}" }

  - name: data create with a bad enum is rejected (exit 1)
    cli: { args: ["<APPDIR>", "data", "cards", "create", "--title", "x", "--priority", "nope"] }
    expect:
      exit: 1

  - name: an unknown data verb is a usage error (exit 2)
    cli: { args: ["<APPDIR>", "data", "cards", "frobnicate"] }
    expect:
      exit: 2

  # The app comes first, unconditionally — the parser never inspects it to
  # decide "app or path?", so a verb-first invocation is a usage error rather
  # than being silently accepted (framework spec 5.1).
  - name: verb-first ordering is rejected (exit 2)
    cli: { args: ["data", "<APPDIR>", "schema"] }
    expect:
      exit: 2
