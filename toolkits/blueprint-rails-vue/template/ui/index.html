<!doctype html>
<!-- The View shell (AGENT-OWNED). Vite entry point: `npm run build` compiles
     this plus src/ into ../public, which Rails serves. tokens.css and ui.css
     live in ui/public/ and are copied through the build verbatim, so the kit
     token sheet keeps its canonical path (/tokens.css). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- The server's update watcher (/_a2app/update.js, system-owned) is loaded
         at runtime from src/updater.js — it cannot be a script tag here because
         Vite would try to bundle a file that only exists on the running server. -->
  </body>
</html>
