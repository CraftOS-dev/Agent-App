<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent App — Tasks</title>
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --line: #2a2a2a; --accent: #60a5fa; } }
      * { box-sizing: border-box; }
      body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
      p.sub { color: var(--muted); margin: 0 0 1.5rem; }
      form { display: flex; gap: .5rem; margin-bottom: 1rem; }
      input, select, button { font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
      input[type=text] { flex: 1; }
      button { cursor: pointer; border-color: var(--accent); color: var(--accent); }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; align-items: center; gap: .6rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
      li .title { flex: 1; }
      li.done .title { text-decoration: line-through; color: var(--muted); }
      .pill { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .5rem; }
      .x { color: var(--muted); cursor: pointer; border: none; background: none; font-size: 1rem; }
      footer { color: var(--muted); font-size: .8rem; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <h1 id="appname">Tasks</h1>
    <p class="sub">A human uses this View; an agent operates the same data through A2App. Both see each other's changes.</p>

    <form id="add">
      <input type="text" id="title" placeholder="Add a task…" required />
      <select id="status"><option value="todo">To do</option><option value="doing">Doing</option><option value="done">Done</option></select>
      <button type="submit">Add</button>
    </form>

    <ul id="list"></ul>
    <footer id="foot"></footer>

    <script type="module" src="./app.js"></script>
    <!-- The server's update watcher (system-owned, served from /_a2app/update.js).
         The View is served from disk, so a promote is live at once — but a tab
         opened beforehand keeps running the old JavaScript. This notices and
         offers a reload. It NEVER reloads on its own: this is a data-entry app,
         and discarding half-typed input is worse than the stale tab. Keep this
         line when you rewrite the View. -->
    <script type="module" src="/_a2app/update.js"></script>
  </body>
</html>
