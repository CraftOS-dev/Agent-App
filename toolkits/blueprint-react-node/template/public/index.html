<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 id="app-name">Tasks</h1>
        <p class="subtitle">Your list, shared with your agent — changes on either side show up on both.</p>
      </header>

      <main>
        <section class="card" aria-label="Add a task">
          <form id="add-form" class="add-form" novalidate>
            <div class="field">
              <label class="sr-only" for="new-title">Task title</label>
              <input id="new-title" class="input" type="text" maxlength="200" autocomplete="off"
                     placeholder="What needs doing?" aria-describedby="title-error" />
              <p id="title-error" class="field-error" hidden></p>
            </div>
            <div class="field">
              <label class="sr-only" for="new-status">Initial status</label>
              <select id="new-status" class="select">
                <option value="todo">To do</option>
                <option value="doing">Doing</option>
                <option value="done">Done</option>
              </select>
            </div>
            <button id="add-btn" class="btn btn-primary" type="submit">Add task</button>
          </form>
        </section>

        <div class="toolbar">
          <div id="filter" class="seg" role="group" aria-label="Filter tasks by status">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="todo" aria-pressed="false">To do</button>
            <button type="button" data-filter="doing" aria-pressed="false">Doing</button>
            <button type="button" data-filter="done" aria-pressed="false">Done</button>
          </div>
        </div>

        <div id="banner-slot"></div>

        <section id="list-card" class="card" aria-label="Tasks">
          <!-- First paint shows the loading skeleton; app.js replaces it with the
               list, the empty state, or the error state. Row heights match the
               real rows so arriving content does not shift the layout. -->
          <div id="list-slot">
            <div class="skel-row"><span class="skel" style="width:24px;height:24px;border-radius:9999px"></span><span class="skel" style="flex:1;height:14px"></span><span class="skel" style="width:56px;height:24px;border-radius:9999px"></span></div>
            <div class="skel-row"><span class="skel" style="width:24px;height:24px;border-radius:9999px"></span><span class="skel" style="flex:0.7;height:14px"></span><span class="skel" style="width:56px;height:24px;border-radius:9999px"></span></div>
            <div class="skel-row"><span class="skel" style="width:24px;height:24px;border-radius:9999px"></span><span class="skel" style="flex:0.85;height:14px"></span><span class="skel" style="width:56px;height:24px;border-radius:9999px"></span></div>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span id="count" aria-live="polite"></span>
        <span class="hint">Press / to add a task</span>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
    <!-- The server's update watcher (system-owned, served from /_a2app/update.js).
         The View is served from disk, so a promote is live at once — but a tab
         opened beforehand keeps running the old JavaScript. This notices and
         offers a reload. It NEVER reloads on its own: this is a data-entry app,
         and discarding half-typed input is worse than the stale tab. Keep this
         line when you rewrite the View. -->
    <script type="module" src="/_a2app/update.js"></script>
  </body>
</html>
