# The Rust server + native A2App adapter. Versions are caret-compatible
# ranges on purpose — the blueprint carries no lockfile; the scaffolded app's
# first `cargo fetch` resolves and locks them.
[package]
name = "rust-react-agent-app"
version = "0.1.0"
edition = "2021"
description = "An Agent App scaffolded from blueprint-rust-react: React (Vite) View + Rust (tiny_http) server + SQLite store."
publish = false

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
# preserve_order: an object keeps its keys in the order they arrived, as a
# JavaScript object does — the guard reports a body's violations in body order
# and describe lists entities in declaration order, both as adapter-core does.
serde_json = { version = "1", features = ["preserve_order"] }
# "bundled" compiles SQLite in, so the app needs no system library — the first
# build is slow for exactly that reason, and fast ever after.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Parses A2APP_PUBLIC_URL and Host header values (see network_policy).
url = "2"
# Accounts and credentials (spec/v0_2/auth.md): every secret from the OS CSPRNG,
# passwords as PBKDF2-HMAC-SHA256, hashes compared in constant time, and the
# base64 that tokens and stored password hashes are written in.
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2"
base64 = "0.22"
